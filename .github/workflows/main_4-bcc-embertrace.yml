# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - 4-bcc-embertrace

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

env:
  # The processed data the site serves. Change this link when the v2 data zip is uploaded.
  DATA_ZIP_URL: https://github.com/leon-pscl/4-bcc-nasa/releases/download/v1.0.0/processed_data.zip

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          test -f dist/index.html

      - name: Fetch processed data
        run: |
          mkdir -p data/processed
          curl -fL -o data.zip "$DATA_ZIP_URL"
          python -c "import zipfile,os;z=zipfile.ZipFile('data.zip');[(os.makedirs(os.path.dirname(p),exist_ok=True),open(p,'wb').write(z.read(i))) for i in z.infolist() for p in [os.path.join('data/processed',i.filename.replace(chr(92),'/'))] if not i.filename.endswith((chr(92),'/')) and '..' not in p]"
          rm data.zip
          ls data/processed
          test -n "$(find data/processed/harmonized_daily -name '*.parquet' | head -1)"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !frontend/node_modules/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: '4-bcc-embertrace'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B6965D2116A74251BF468B0F28B01AC0 }}
