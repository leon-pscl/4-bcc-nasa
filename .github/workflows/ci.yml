name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: No 32-hex strings outside data and mocks (leaked-secret guard)
        run: |
          if git grep -InE '\b[0-9a-fA-F]{32}\b' -- . ':!frontend/public/mock'; then
            echo "::error::32-hex string found outside data/ and mock files (possible leaked secret). See instructions.md section 3, rule 8."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - run: cd frontend && npm ci && npm run check