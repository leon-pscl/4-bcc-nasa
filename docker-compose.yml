services:
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      # DATA_DIR points at the data drive; the web container stays read-only
      - ${DATA_DIR:-./data}:/app/data:ro
    environment:
      - FLASK_DEBUG=0
    mem_limit: 4g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,sys,urllib.request; r=urllib.request.urlopen('http://localhost:8000/health', timeout=8); d=json.loads(r.read()); sys.exit(0 if d.get('status') != 'error' else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  updater:
    build:
      context: .
      target: pipeline
    command: ["sh", "-c", "while true; do if pipeline update --all; then sleep 86400; else echo 'update failed; retrying in 1h'; sleep 3600; fi; done"]
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      # DuckDB spill files live on a named volume, not the container's writable layer
      - duckdb-tmp:/tmp/duckdb
    environment:
      - FLASK_DEBUG=0
      # .env is used by compose for interpolation; only the key is passed through
      - FIRMS_MAP_KEY=${FIRMS_MAP_KEY}
    mem_limit: 4g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  duckdb-tmp:
